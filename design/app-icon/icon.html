<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dsh-design" content="poster 560x760">
<title>应用图标 · 手机遥控麦</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    padding: 24px;
    background:
      radial-gradient(circle at 18% 12%, #FFE0CE 0, transparent 45%),
      radial-gradient(circle at 85% 75%, #C9E2FF 0, transparent 50%),
      #EAF0F6;
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .stage { width: 512px; height: 512px; filter: drop-shadow(0 22px 34px rgba(16,21,28,.22)); }
  .row { display: flex; align-items: flex-end; gap: 26px; }
  .small { filter: drop-shadow(0 8px 12px rgba(16,21,28,.2)); }
  .caption { margin-top: 6px; font-size: 12px; color: #4F5B69; text-align: center; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="appicon" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg" x1="40" y1="20" x2="470" y2="500" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#F8FCFF"/>
          <stop offset="0.55" stop-color="#D9EAF9"/>
          <stop offset="1" stop-color="#B4D3EF"/>
        </linearGradient>
        <radialGradient id="warm" cx="0.2" cy="0.15" r="0.62">
          <stop offset="0" stop-color="#FFE0CE" stop-opacity="0.95"/>
          <stop offset="1" stop-color="#FFE0CE" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="cool" cx="0.85" cy="0.78" r="0.62">
          <stop offset="0" stop-color="#8FC2F0" stop-opacity="0.5"/>
          <stop offset="1" stop-color="#8FC2F0" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gloss" x1="80" y1="0" x2="300" y2="260" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
          <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <filter id="ringShadow" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#173F60" flood-opacity="0.22"/>
        </filter>
        <clipPath id="squircle">
          <rect x="0" y="0" width="512" height="512" rx="116"/>
        </clipPath>
      </defs>

      <g clip-path="url(#squircle)">
        <rect width="512" height="512" fill="url(#bg)"/>
        <rect width="512" height="512" fill="url(#warm)"/>
        <rect width="512" height="512" fill="url(#cool)"/>
        <rect width="512" height="512" fill="url(#gloss)"/>
        <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2"/>

        <!-- 方向环：白色厚环带，和 App 主界面的环形方向键同形 -->
        <g filter="url(#ringShadow)">
          <circle cx="256" cy="256" r="128" fill="none" stroke="#FFFFFF" stroke-width="44"/>
        </g>

        <!-- 中心圆钮 + 麦克风 -->
        <circle cx="256" cy="256" r="78" fill="#FFFFFF"/>
        <rect x="239" y="200" width="34" height="64" rx="17" fill="#173F60"/>
        <path d="M214 256a42 42 0 0 0 84 0" fill="none" stroke="#173F60" stroke-width="14" stroke-linecap="round"/>
        <path d="M256 298v20M238 318h36" fill="none" stroke="#173F60" stroke-width="14" stroke-linecap="round"/>
        <path d="M249 212v34" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
      </g>
    </symbol>
  </svg>

  <svg class="stage" viewBox="0 0 512 512" role="img" aria-label="手机遥控麦应用图标">
    <use href="#appicon"/>
  </svg>

  <div class="row">
    <figure>
      <svg class="small" width="96" height="96" viewBox="0 0 512 512" aria-hidden="true"><use href="#appicon"/></svg>
      <figcaption class="caption">96 px</figcaption>
    </figure>
    <figure>
      <svg class="small" width="64" height="64" viewBox="0 0 512 512" aria-hidden="true"><use href="#appicon"/></svg>
      <figcaption class="caption">64 px</figcaption>
    </figure>
    <figure>
      <svg class="small" width="48" height="48" viewBox="0 0 512 512" aria-hidden="true"><use href="#appicon"/></svg>
      <figcaption class="caption">48 px</figcaption>
    </figure>
    <figure>
      <svg class="small" width="32" height="32" viewBox="0 0 512 512" aria-hidden="true"><use href="#appicon"/></svg>
      <figcaption class="caption">32 px</figcaption>
    </figure>
  </div>
</body>
</html>
